type: marketplace
title: Mathematics in Deep Learning
language: English
summary: |
  Calculus, linear algebra and probability for deep learning, then
  training networks: linear regression, backpropagation and a first
  network; fully connected networks for classification, autoencoders,
  adversarial generation, word embeddings, movie recommendation and a
  tiny NeRF; optimizers from gradient descent to Adam, Lion and Muon; and
  deep networks with batch normalization and residual blocks.

  This course contains practice tasks taught in the JetBrains'
  Computer Science and Artificial Intelligence (CSAI) program at Neapolis
  University Pafos (NUP), Cyprus.
programming_language: Python
programming_language_version: 3.12
environment: unittest
content:
  - Calculus
  - Linear Algebra
  - Probability
  - Training a Network
  - Fully Connected NNs
  - Optimizers
  - Deep Fully Connected NNs
  - source
